name: Build and Push Image

on:
  push:
    branches: [main]
    paths:
      - 'common/**'
      - 'jobs/**'
      - 'docker/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/build.yml'
  workflow_dispatch:

env:
  IMAGE: peterlocal/arxiv-prod-lab-pipeline

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set image tag
        id: tag
        run: echo "tag=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Update k8s deployment image
        run: |
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${{ steps.tag.outputs.tag }}|" k8s/deployment.yaml
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          if git diff --staged --quiet; then echo "No changes"; else
            git commit -m "chore: bump image to ${{ steps.tag.outputs.tag }} [skip ci]"
            git push
          fi
