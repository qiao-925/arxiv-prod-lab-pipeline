[pytest]
testpaths = tests
markers =
    integration: 需要真实 PG / 真实 GitHub API 的集成测试
    e2e: 完整状态机端到端测试（真实 PG + 真实 GitHub API）
    coordination: 调度协调层测试（真实 PG + 真实 API + 真实子进程）

; 直接在终端显示 job 日志，便于观察状态机与落库过程
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] [%(name)s] %(message)s
log_cli_date_format = %H:%M:%S
