[project]
name = "arxiv-prod-lab-pipeline"
version = "0.1.0"
description = "arXiv + GitHub 实时热度监测数据平台"
requires-python = ">=3.14"
dependencies = [
    "apscheduler>=3.11.3",
    "infisicalsdk>=1.0.17",
    "kafka-python>=2.0.2",
    "minio>=7.2.20",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false
